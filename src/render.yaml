services:
  - type: web
    name: prolaje-api
    runtime: node
    plan: free
    region: oregon
    rootDir: src/back
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm run db:seed && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prolaje-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: DEFAULT_SELLER_NAME
        value: Casa Lajes

databases:
  - name: prolaje-db
    plan: free
    region: oregon
    databaseName: prolaje
    user: prolaje
    postgresMajorVersion: "16"
